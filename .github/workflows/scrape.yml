name: Scrape tee times

on:
  # GH Actions' own cron is unreliable on the free tier (can be delayed by
  # hours under platform load). Vercel Cron triggers this workflow via the
  # /api/cron/scrape route on every-30-min schedule. We keep workflow_dispatch
  # for manual + Vercel-triggered runs.
  workflow_dispatch: {}
  # Backstop (Nov 2026): the external trigger (cron-job.org -> Vercel ->
  # dispatch) has died three times, each time leaving the site on stale data
  # for days. GitHub's own schedule can start a few minutes late, but it does
  # not depend on either service. The concurrency group below keeps at most
  # one run waiting, so running both triggers is harmless.
  # GitHub turns schedules off in public repos after 60 days with no commits;
  # the health check emails when data goes stale, which would catch that.
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned, not ubuntu-latest: GitHub moved ubuntu-latest to 26.04 (Nov 2026)
    # and Playwright 1.60 can't install Chromium there, so every run failed at
    # the browser-install step. Bump only after Playwright supports the new image.
    runs-on: ubuntu-24.04
    # Raised from 10 → 20 min: we added Chula Vista + Goat Hill + Loma Club +
    # Oaks North + Welk Fountains + Welk Oaks + Lomas Santa Fe (32 courses
    # total) and the prior 10-min budget started canceling mid-run.
    timeout-minutes: 20
    env:
      # CRITICAL: scrapers build their day-0 date from the process-local clock.
      # GH runners are UTC, so after 5pm PDT "today" rolled to tomorrow — every
      # evening run skipped today and the sweep deleted today's remaining
      # twilight slots. Pin the process TZ to Pacific so day math matches the
      # golf courses.
      TZ: America/Los_Angeles
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FOREUP_USERNAME: ${{ secrets.FOREUP_USERNAME }}
      FOREUP_PASSWORD: ${{ secrets.FOREUP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      ALERT_MAX_PRICE_CENTS: ${{ secrets.ALERT_MAX_PRICE_CENTS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npx tsx scrapers/_runner.ts
